name: Build

on:
  # Deprecated repo: automatic scheduled rebuilds are disabled (the Obsidian
  # Local REST API plugin now ships a built-in MCP server). Manual builds for
  # existing users are still possible via the "Run workflow" button.
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Additional tag to publish (e.g. v1.0.1)"
        required: false
        default: ""
      upstream_version:
        description: "Upstream mcp-obsidian version on PyPI (default 0.2.2)"
        required: false
        default: "0.2.2"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/junkerderprovinz/mcp-obsidian
  DEFAULT_UPSTREAM_VERSION: "0.2.2"

jobs:
  build:
    name: Build & push multi-arch image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve upstream version
        id: ver
        run: |
          v="${{ github.event.inputs.upstream_version }}"
          if [ -z "$v" ]; then
            v="${{ env.DEFAULT_UPSTREAM_VERSION }}"
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Upstream mcp-obsidian version: $v"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v1.0.0
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=mcp-obsidian
            org.opencontainers.image.description=MCP server for Obsidian (Unraid Docker template wrapper).
            org.opencontainers.image.url=https://github.com/junkerderprovinz/mcp-obsidian
            org.opencontainers.image.source=https://github.com/junkerderprovinz/mcp-obsidian
            org.opencontainers.image.licenses=MIT

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            UPSTREAM_VERSION=${{ steps.ver.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
